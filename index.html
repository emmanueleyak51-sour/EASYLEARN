<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B2BD6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Easy Learn" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/easylearn-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Road to Campus · Easy Learn</title>
    <meta name="description" content="JAMB UTME and WAEC/NECO mastery across 49 subjects with interactive worlds, virtual labs, voice teachers, and CBT mocks." />
    <meta property="og:title" content="Road to Campus · Easy Learn" />
    <meta property="og:description" content="JAMB UTME and WAEC/NECO mastery across 49 subjects with interactive worlds, virtual labs, voice teachers, and CBT mocks." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Easy Learn" />
    <meta property="og:image" content="/easylearn-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Road to Campus · Easy Learn" />
    <meta name="twitter:description" content="JAMB UTME and WAEC/NECO mastery across 49 subjects with interactive worlds, virtual labs, voice teachers, and CBT mocks." />
    <meta name="twitter:image" content="/easylearn-logo.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Road to Campus · Easy Learn",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "description": "JAMB UTME and WAEC/NECO preparation across 49 subjects with live voice teachers, virtual labs, and Saturday CBT rankings.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "NGN"
        }
      }
    </script>
    <style>
      .rtc-boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #F7F8FC;
        color: #16192C;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .rtc-boot-shell {
          background: #0D1021;
          color: #F8FAFC;
        }
      }
      .rtc-boot-mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: #5B2BD6;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        box-shadow: 0 8px 24px -6px rgba(91, 43, 214, 0.45);
      }
      .rtc-boot-bar {
        width: 148px;
        height: 4px;
        border-radius: 999px;
        background: rgba(91, 43, 214, 0.16);
        overflow: hidden;
      }
      .rtc-boot-bar > span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: #5B2BD6;
        animation: rtcBootSlide 1.05s ease-in-out infinite alternate;
      }
      @keyframes rtcBootSlide {
        from { transform: translateX(0%); }
        to { transform: translateX(122%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="rtc-boot-shell" aria-label="Loading Easy Learn">
        <div class="rtc-boot-mark" aria-hidden="true">EL</div>
        <div style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em;">Easy Learn</div>
        <div class="rtc-boot-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
