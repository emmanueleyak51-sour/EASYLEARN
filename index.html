    <style>
      body {
        margin: 0;
        background: #F4F7FD;
      }
      .rtc-boot-shell {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background-color: #F4F7FD;
        background-image:
          radial-gradient(circle at 50% 38%, rgba(29, 78, 216, 0.13) 0%, rgba(124, 58, 237, 0.08) 36%, transparent 68%),
          linear-gradient(rgba(15, 23, 42, 0.038) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 23, 42, 0.038) 1px, transparent 1px);
        background-size: 100% 100%, 44px 44px, 44px 44px;
        color: #0F172A;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .rtc-boot-stage {
        position: relative;
        z-index: 2;
        max-width: 512px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 24px;
      }
      .rtc-boot-emblem {
        position: relative;
        width: 218px;
        height: 218px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .rtc-boot-aura {
        position: absolute;
        width: 196px;
        height: 196px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(29, 78, 216, 0.38) 0%, rgba(124, 58, 237, 0.24) 44%, rgba(245, 158, 11, 0.2) 66%, transparent 78%);
        filter: blur(14px);
        animation: rtcAuraPulse 2.6s ease-in-out infinite;
        will-change: transform, opacity;
      }
      .rtc-boot-orbit {
        position: absolute;
        inset: 0;
        width: 218px;
        height: 218px;
        animation: rtcOrbitSpin 11s linear infinite;
        will-change: transform;
      }
      .rtc-boot-orbit-inner {
        position: absolute;
        inset: 0;
        width: 218px;
        height: 218px;
        opacity: 0.65;
        animation: rtcOrbitReverse 16s linear infinite;
        will-change: transform;
      }
      .rtc-boot-crest {
        position: relative;
        z-index: 2;
        width: 160px;
        height: 160px;
        border-radius: 38px;
        overflow: hidden;
        background: #13073B;
        box-shadow: 0 20px 50px -12px rgba(29, 78, 216, 0.52), 0 0 0 1.5px rgba(251, 191, 36, 0.48);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: rtcCrestFloat 2.8s ease-in-out infinite;
        will-change: transform;
      }
      .rtc-boot-crest-svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .rtc-tassel-pendulum {
        transform-origin: 74px 66px;
        animation: rtcTasselSway 3.4s ease-in-out infinite;
      }
      .rtc-star-pulse {
        transform-origin: 176px 59px;
        animation: rtcStarBreath 2.5s ease-in-out infinite;
      }
      .rtc-bar-1 { transform-origin: 127px 191px; animation: rtcBarRise 2.4s ease-in-out 0.1s infinite; }
      .rtc-bar-2 { transform-origin: 145px 187px; animation: rtcBarRise 2.4s ease-in-out 0.25s infinite; }
      .rtc-bar-3 { transform-origin: 163px 179px; animation: rtcBarRise 2.4s ease-in-out 0.4s infinite; }
      .rtc-boot-sheen {
        position: absolute;
        z-index: 3;
        inset: 0;
        background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.22) 50%, transparent 68%);
        transform: translateX(-145%);
        animation: rtcCrestSheen 3.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        pointer-events: none;
        will-change: transform;
      }
      .rtc-boot-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .rtc-boot-kicker {
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #1D4ED8;
      }
      .rtc-boot-title {
        margin: 0;
        font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 32px;
        line-height: 1.12;
        letter-spacing: -0.02em;
      }
      .rtc-boot-sub {
        margin: 0;
        font-size: 14.5px;
        font-weight: 500;
        color: #475569;
      }
      .rtc-boot-meta {
        margin: 2px 0 0;
        font-size: 12.5px;
        font-weight: 600;
        color: #64748B;
      }
      .rtc-boot-bar {
        width: 240px;
        height: 6px;
        border-radius: 999px;
        background: #E2E8F0;
        overflow: hidden;
      }
      .rtc-boot-bar > span {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #1D4ED8 0%, #6366F1 52%, #F59E0B 100%);
        transform-origin: left center;
        animation: rtcBootSlide 1.8s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
        will-change: transform;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #090F1E;
        }
        .rtc-boot-shell {
          background-color: #090F1E;
          background-image:
            radial-gradient(circle at 50% 38%, rgba(37, 99, 235, 0.22) 0%, rgba(109, 40, 217, 0.14) 34%, transparent 68%),
            linear-gradient(rgba(148, 163, 184, 0.055) 1px, transparent 1px),
            linear-gradient(90deg, rgba(148, 163, 184, 0.055) 1px, transparent 1px);
          color: #F8FAFC;
        }
        .rtc-boot-kicker { color: #60A5FA; }
        .rtc-boot-sub { color: #CBD5E1; }
        .rtc-boot-meta { color: #94A3B8; }
        .rtc-boot-bar { background: rgba(30, 41, 59, 0.9); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rtc-boot-aura,
        .rtc-boot-orbit,
        .rtc-boot-orbit-inner,
        .rtc-boot-crest,
        .rtc-tassel-pendulum,
        .rtc-star-pulse,
        .rtc-bar-1,
        .rtc-bar-2,
        .rtc-bar-3,
        .rtc-boot-sheen,
        .rtc-boot-bar > span {
          animation: none !important;
        }
        .rtc-boot-sheen { display: none; }
      }
      @keyframes rtcOrbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rtcOrbitReverse {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes rtcAuraPulse {
        0%, 100% { opacity: 0.5; transform: scale(0.92); }
        50% { opacity: 0.86; transform: scale(1.08); }
      }
      @keyframes rtcCrestFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes rtcTasselSway {
        0%, 100% { transform: rotate(-9deg); }
        50% { transform: rotate(7deg); }
      }
      @keyframes rtcStarBreath {
        0%, 100% { transform: scale(1) rotate(-2deg); }
        50% { transform: scale(1.07) rotate(3deg); }
      }
      @keyframes rtcBarRise {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.06); }
      }
      @keyframes rtcCrestSheen {
        0% { transform: translateX(-145%); }
        55%, 100% { transform: translateX(155%); }
      }
      @keyframes rtcBootSlide {
        from { transform: scaleX(0.16); }
        to { transform: scaleX(1); }
      }
    </style>
